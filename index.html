<html lang="en">
<head>

<title>Sanmati H.S. School — Council Introductions</title>

<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#15171a; --muted:#69717d;
  --line:#e5e7eb; --accent:#111827; --soft:#f0f2f5;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.header{background:#101216;color:white;padding:54px 6vw 42px}
.header-inner{max-width:1200px;margin:auto}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:#aeb5c0;font-weight:700}
h1{font-size:clamp(32px,5vw,62px);line-height:.98;margin:12px 0 14px;letter-spacing:-.04em}
.subtitle{max-width:680px;color:#c7cbd1;font-size:16px;line-height:1.6;margin:0}
.main{max-width:1200px;margin:auto;padding:28px 6vw 60px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}
button,.search{font:inherit}
button{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 16px;cursor:pointer;color:#3c434d}
button.active{background:#111216;color:white;border-color:#111216}
.search{flex:1;min-width:220px;border:1px solid var(--line);background:white;border-radius:999px;padding:12px 18px;outline:none}
.search:focus{border-color:#9ca3af;box-shadow:0 0 0 3px #e5e7eb}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:25px}
.stat{background:white;border:1px solid var(--line);border-radius:14px;padding:13px 17px}
.stat b{font-size:20px;margin-right:5px}.stat span{color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:25px;display:flex;flex-direction:column;min-height:390px;box-shadow:0 5px 20px rgba(16,24,40,.035)}
.top{display:flex;gap:15px;align-items:center;margin-bottom:20px}
.avatar{width:56px;height:56px;border-radius:16px;background:#111216;color:white;display:grid;place-items:center;font-weight:800;font-size:20px;flex:none}
.name{font-size:21px;font-weight:800;letter-spacing:-.02em}
.position{font-size:13px;color:var(--muted);margin-top:4px;line-height:1.35}
.badge{display:inline-block;margin-top:7px;background:var(--soft);border-radius:999px;padding:5px 9px;font-size:11px;font-weight:700;color:#555d68}
.section{border-top:1px solid var(--line);padding-top:16px;margin-top:14px}
.label{font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:800;color:#8a919b;margin-bottom:7px}
.text{font-size:14px;line-height:1.6;color:#343a43}
.footer{max-width:1200px;margin:0 auto;padding:0 6vw 35px;color:#8a919b;font-size:12px;text-align:center}
.empty{text-align:center;color:var(--muted);padding:60px 10px;grid-column:1/-1}
.loading{text-align:center;color:var(--muted);padding:60px 10px;grid-column:1/-1}
.error{text-align:center;color:#b42318;padding:60px 10px;grid-column:1/-1}
@media(max-width:600px){.header{padding:40px 5vw}.main{padding:22px 5vw 45px}.card{min-height:0}}
</style>
</head>
<body>
<header class="header">
  <div class="header-inner">
    <div class="eyebrow">Sanmati H.S. School</div>
    <h1>Council Introductions</h1>
    <p class="subtitle">Meet the student leaders, their strengths, and what they bring to the Student Council.</p>
  </div>
</header>

<main class="main">
  <div class="toolbar">
    <button class="filter active" data-filter="all">All</button>

    <button class="filter" data-filter="House Council">House Council</button>
    <input id="search" class="search" placeholder="Search by name or position…">
  </div>

  <div class="stats">
    <div class="stat"><b id="total">0</b><span>Introductions</span></div>
    <div class="stat"><b id="mainCount">0</b><span>Main Council</span></div>
    <div class="stat"><b id="houseCount">0</b><span>House Council</span></div>
  </div>

  <section id="grid" class="grid"><div class="loading">Loading introductions…</div></section>
</main>
<div class="footer">Council Badge Introduction • Sanmati H.S. School</div>

let data = [];
let filter = "all";
const search = document.getElementById("search");
const grid = document.getElementById("grid");

function initials(name){
  return name.split(/\s+/).filter(Boolean).slice(0,2).map(x=>x[0]).join("").toUpperCase();
}
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function render(){
  const q = search.value.toLowerCase().trim();
  const items = data.filter(x =>
    (filter === "all" || x.council === filter) &&
    (!q || (x.name+" "+x.position+" "+x.qualities+" "+x.strongest).toLowerCase().includes(q))
  );

  grid.innerHTML = items.length ? items.map(x => `
    <article class="card">
      <div class="top">
        <div class="avatar">${esc(initials(x.name))}</div>
        <div>
          <div class="name">${esc(x.name)}</div>
          <div class="position">${esc(x.position)}</div>
          <div class="badge">${esc(x.council === "Council" ? "Main Council" : x.council || "Council")}</div>
        </div>
      </div>
      <div class="section">
        <div class="label">Three best qualities</div>
        <div class="text">${esc(x.qualities) || "—"}</div>
      </div>
      <div class="section">
        <div class="label">Strongest quality & why</div>
        <div class="text">${esc(x.strongest) || "—"}</div>
      </div>
      <div class="section">
        <div class="label">What I contribute</div>
        <div class="text">${esc(x.contribution) || "—"}</div>
      </div>
    </article>
  `).join("") : `<div class="empty">No introductions match your search.</div>`;

  document.getElementById("total").textContent = data.length;
  document.getElementById("mainCount").textContent = data.filter(x=>x.council==="Council").length;
  document.getElementById("houseCount").textContent = data.filter(x=>x.council==="House Council").length;
}

document.querySelectorAll(".filter").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll(".filter").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    filter = btn.dataset.filter;
    render();
  });
});
search.addEventListener("input",render);

const results = Papa.parse(CSV_TEXT, {
  header: true,
  skipEmptyLines: true
});

if (results.errors && results.errors.length) {
  console.warn("CSV parse warnings:", results.errors);
}

data = results.data
  .map(row => ({
    council: (row.council || "").trim(),
    name: (row.name || "").trim(),
    position: (row.position || "").trim(),
    qualities: (row.qualities || "").trim(),
    strongest: (row.strongest || "").trim(),
    contribution: (row.contribution || "").trim()
  }))
  .filter(row => row.name);

render();
</script>
</body>
</html>
